# ═══════════════════════════════════════════════════════════════
# Word Cloud - Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════
# This config:
#  - Serves Vue/React frontend static files from /opt/word-cloud/dist
#  - Proxies /socket.io WebSocket to Node.js backend (port 3001)
#  - Provides /health endpoint for monitoring
# ═══════════════════════════════════════════════════════════════

upstream word-cloud-backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain if you have one

    # ── Frontend Static Files ─────────────────────────────────
    root /opt/word-cloud/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Health Check (proxied to backend) ─────────────────────
    location /health {
        proxy_pass http://word-cloud-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── Socket.IO WebSocket Proxy ─────────────────────────────
    location /socket.io/ {
        proxy_pass http://word-cloud-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket needs long timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 30s;

        # Buffer settings for WebSocket
        proxy_buffering off;
        proxy_buffer_size 4k;
    }

    # ── SPA Fallback: all other routes → index.html ──────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets with hashed filenames
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Security Headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

